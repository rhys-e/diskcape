[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diskscape"
dynamic = ["version"]
description = "A zero-dependency disk space analyser for macOS with a fast, local web UI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
keywords = ["disk", "space", "usage", "analyzer", "treemap", "sunburst", "macos"]
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

[project.scripts]
diskscape = "diskscape.server:main"

[tool.setuptools]
packages = ["diskscape"]

[tool.setuptools.dynamic]
version = { attr = "diskscape.__version__" }

[tool.setuptools.package-data]
diskscape = ["static/*"]
