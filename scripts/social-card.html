<!doctype html>
<!-- GitHub social preview card, rendered at 1280x640 by scripts/screenshot.py.
     {{SCREENSHOT}} and {{REPO}} are filled in by the script. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(600px 420px at 8% 110%, rgba(169, 112, 255, .28), transparent 70%),
      radial-gradient(700px 500px at 75% -10%, rgba(91, 140, 255, .25), transparent 70%),
      #0e1015;
    color: #e8eaf0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 500px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 20px; }
  .logo {
    width: 64px; height: 64px; border-radius: 50%; flex: none;
    background: conic-gradient(#5b8cff 0 28%, #a970ff 0 46%, #ff6fa8 0 61%, #ffb547 0 74%, #4fd1a5 0 88%, #3ab8ff 0);
    -webkit-mask: radial-gradient(circle, transparent 15px, #000 16px);
            mask: radial-gradient(circle, transparent 15px, #000 16px);
  }
  h1 { margin: 0; font-size: 76px; font-weight: 750; letter-spacing: -.035em; line-height: 1; }
  .tagline { margin: 30px 0 0; font-size: 34px; line-height: 1.25; font-weight: 600; letter-spacing: -.015em; color: #c9cedb; }
  .tagline b { color: #fff; font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 34px; }
  .chips span {
    font-size: 19px; font-weight: 600; color: #c9cedb;
    padding: 8px 15px; border-radius: 999px;
    background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .1);
  }
  .repo { margin-top: 38px; font: 500 19px ui-monospace, "SF Mono", Menlo, monospace; color: #8a92a6; }
  .window {
    position: absolute; left: 620px; top: 74px; width: 900px;
    border-radius: 14px; overflow: hidden;
    border: 1px solid rgba(255, 255, 255, .12);
    box-shadow: 0 30px 80px rgba(0, 0, 0, .6), 0 0 0 1px rgba(0, 0, 0, .4);
    background: #161920;
  }
  .bar { height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 13px; background: #1e222b; }
  .bar i { width: 12px; height: 12px; border-radius: 50%; background: #3a3f4b; }
  .bar i:nth-child(1) { background: #ff5f57; } .bar i:nth-child(2) { background: #febc2e; } .bar i:nth-child(3) { background: #28c840; }
  .window img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><span class="logo"></span><h1>Diskscape</h1></div>
    <p class="tagline">See what's filling your Mac's disk. <b>Zero dependencies.</b></p>
    <div class="chips"><span>Sunburst &amp; treemap</span><span>Python stdlib only</span><span>100% local</span></div>
    <div class="repo">{{REPO}}</div>
  </div>
  <div class="window">
    <div class="bar"><i></i><i></i><i></i></div>
    <img src="{{SCREENSHOT}}" alt="">
  </div>
</body>
</html>
