name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs (tags can be moved); the comment names the release.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.9", "3.13"]
        # 3.9 (macOS's system Python) has no build for Ubuntu 26.04, so test it on 24.04.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest -v
      - name: Front-end syntax check
        run: node --check diskscape/static/app.js
      - name: CLI smoke test
        run: python -m diskscape --version
      # Linux only: on GitHub's macOS runners `open` never completes an app launch
      # (probably no desktop session), so the macOS path is tested by hand with DISKSCAPE_BROWSER_MANUAL=1.
      - name: Real-browser test (headless Chrome preinstalled on the runner)
        if: runner.os == 'Linux'
        run: python -X faulthandler -m unittest -v tests.test_browser
        timeout-minutes: 5
        env:
          DISKSCAPE_BROWSER_TESTS: "1"

  # The tests run from the source tree, so they wouldn't notice a wheel that left out the UI.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f  # v1.3.2
        with:
          mode: firewall-free
      - name: Build the wheel (setuptools is fetched through Socket Firewall)
        run: sfw pip wheel . --no-deps --wheel-dir dist
      - name: Check the wheel includes the UI
        shell: python
        run: |
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/diskscape-*.whl")[0]).namelist()
          missing = [f for f in ("index.html", "app.js", "style.css") if f"diskscape/static/{f}" not in names]
          assert not missing, f"the wheel is missing diskscape/static/{missing}"
          print(f"OK: {len(names)} files, UI included")
